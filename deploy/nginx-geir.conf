# nginx: /etc/nginx/conf.d/geir.conf — HTTPS in front of GEIR (GEIR_HOST=127.0.0.1 or
# 0.0.0.0 with the port closed in the firewall, GEIR_TRUST_PROXY=true).
server {
    listen 80;
    server_name geir.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name geir.example.com;

    ssl_certificate     /etc/ssl/certs/geir.crt;
    ssl_certificate_key /etc/ssl/private/geir.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Evidence images and GEIR workbooks travel in the requests.
    client_max_body_size 60m;
    # Microsoft sign-in and GitLab searches can take a few minutes.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
